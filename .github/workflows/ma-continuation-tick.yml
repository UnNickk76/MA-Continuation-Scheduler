name: MA Continuation Tick

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  wake-ma-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtain GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ma-workspace-continuation")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      - name: Wake MA project continuation
        shell: bash
        env:
          MA_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS --retry 2 --retry-delay 10 -o /tmp/ma-continuation-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${MA_OIDC_TOKEN}" \
            https://ma-workspace-2.onrender.com/api/continuation/tick)"
          cat /tmp/ma-continuation-response.json
          echo
          echo "HTTP ${http_code}"
          test "${http_code}" = "200"
